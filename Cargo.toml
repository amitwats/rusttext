[package]
name = "rusttext"
version = "0.1.0"
edition = "2024"
description = "A lightweight rich text editor (TXT, Markdown, RTF, DOCX) written in Rust"
authors = ["amitwats"]
readme = "README.md"
default-run = "rusttext"

[lib]
name = "rusttext"
path = "src/lib.rs"

[[bin]]
name = "rusttext"
path = "src/main.rs"

[dependencies]
# GUI
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.37"
rfd = "0.18"
arboard = { version = "3", default-features = false }
# Fonts
fontdb = "0.24"
# File formats
pulldown-cmark = { version = "0.13", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
# Utilities
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
